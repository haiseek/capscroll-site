<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CapScroll Privacy Policy</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #59636e;
  --line: #d8dee4;
  --accent: #0b62d6;
  --code-bg: #f2f4f7;
  --chip-bg: #f2f4f7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a;
    --fg: #e6e8eb;
    --muted: #9aa3ad;
    --line: #2f343a;
    --accent: #6cb0ff;
    --code-bg: #24282d;
    --chip-bg: #22262b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 1rem;
  line-height: 1.7;
  overflow-wrap: break-word;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header { display: flex; align-items: center; gap: .6rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
header img { width: 32px; height: 32px; }
header .brand { font-weight: 600; font-size: 1.05rem; }
nav.languages { margin: 1rem 0 0; display: flex; align-items: flex-start; gap: .5rem; }
nav.languages > svg { flex: none; margin-top: .4rem; color: var(--muted); }
nav.languages ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
nav.languages a {
  display: inline-block; padding: .2rem .65rem; border-radius: 999px;
  background: var(--chip-bg); color: var(--fg); text-decoration: none; font-size: .875rem; line-height: 1.6;
}
nav.languages a:hover { text-decoration: underline; }
nav.languages a[aria-current="page"] { background: var(--accent); color: var(--bg); font-weight: 600; }
main h1 { font-size: 1.75rem; line-height: 1.3; margin: 1.75rem 0 .5rem; }
main h2 { font-size: 1.2rem; line-height: 1.4; margin: 2rem 0 .5rem; }
main h3 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
main p, main ul { margin: .6rem 0; }
main ul { padding-left: 1.4rem; }
main li { margin: .3rem 0; }
main a { color: var(--accent); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.index-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .5rem; }
.index-list a { display: block; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 8px; color: var(--fg); text-decoration: none; }
.index-list a:hover { border-color: var(--accent); }
</style>
<script>
(function () {
  var available = ["ko","en","ja","zh-TW","es","pt-BR","fr","de","it","ru","vi","id","th","tr","hi","pl"];
  var lower = available.map(function (tag) { return tag.toLowerCase(); });
  function match(language) {
    var tag = String(language || '').replace(/_/g, '-').toLowerCase();
    if (!tag) return null;
    var parts = tag.split('-');
    var primary = parts[0];
    var rest = parts.slice(1);
    if (primary === 'zh') {
      var traditional = rest.indexOf('hant') >= 0 || (rest.indexOf('hans') < 0 && rest.some(function (p) { return p === 'tw' || p === 'hk' || p === 'mo'; }));
      return traditional && lower.indexOf('zh-tw') >= 0 ? 'zh-TW' : null;
    }
    var i = lower.indexOf(tag);
    if (i < 0) i = lower.indexOf(primary);
    if (i < 0) i = lower.findIndex(function (l) { return l.split('-')[0] === primary; });
    return i < 0 ? null : available[i];
  }
  var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
  var chosen = null;
  for (var k = 0; k < languages.length && !chosen; k++) chosen = match(languages[k]);
  location.replace('privacy/' + (chosen || 'en').replace(/-/g, '_') + '.html');
})();
</script>
</head>
<body>
<div class="wrap">
<header><img src="icon.png" alt=""><span class="brand">CapScroll</span></header>
<main>
<h1>Privacy Policy</h1>

</ul>

</div>
</body>
</html>
